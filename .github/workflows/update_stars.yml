name: Update Star Count

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 时间 00:00 运行
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: update-star-count-master
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Update, Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.THESHI }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Refresh this disposable runner checkout before regenerating README.
            # On retry, discard only the previous unpushed generated commit.
            git fetch origin master
            git reset --hard origin/master
            python update_stars.py
            git add README.md

            if git diff --cached --quiet; then
              echo "Statistics are already up to date."
              exit 0
            fi

            git commit -m "Update total stars + forks"
            if git push origin HEAD:master; then
              exit 0
            fi

            echo "Push failed on attempt $attempt; regenerating from latest master."
            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "Unable to push statistics after 3 attempts." >&2
          exit 1
